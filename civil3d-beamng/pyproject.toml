[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdcrd-civil3d-beamng"
version = "0.1.0"
description = "Deterministic Civil 3D TIN to BeamNG.drive interchange package"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "defusedxml>=0.7"]

[project.optional-dependencies]
test = ["pytest>=8", "pycollada>=0.8"]

[project.scripts]
cdcrd-beamng = "cdcrd_beamng.__main__:main"

[tool.setuptools.packages.find]
include = ["cdcrd_beamng*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
